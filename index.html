async function setFu(id){const l=L.find(a=>a.id==id);l.next=$("#fd").value;await save(l)}
async function doneFu(id){const l=L.find(a=>a.id==id);l.fu=[...(l.fu||[]),{d:l.next,done:td()}];l.next="";l.last=td();await save(l)}
async function del(id){const l=L.find(x=>x.id==id);if(!l)return toast("Lead not found",1);const n=(l.notes||[]).length,f=(l.fu||[]).length;
  if(!await ask(`Delete "${l.name||l.biz||"this lead"}" permanently? Its ${n} note(s) and ${f} follow-up record(s) are removed too. This cannot be undone.`,"Delete"))return;
  try{await db.del(id);L=L.filter(x=>x.id!=id);toast("Lead deleted");nav("leads")}catch(e){toast("Delete failed: "+(e&&e.message||e),1)}}
function formV(){const l=cur=="new"?blank():L.find(x=>x.id==cur);window._e=l;
  return `<h2>${cur=="new"?"Add":"Edit"} lead</h2><div class="card"><div class="f">${FLD.map(([k,n])=>`<div><label>${n}</label>${["status","country","niche","source"].includes(k)?cb("e_"+k,k=="status"?ST:LM(k),l[k],n):k=="priority"?`<select id="e_${k}">${["Low","Medium","High"].map(s=>`<option ${l[k]==s?"selected":""}>${s}</option>`).join("")}</select>`:`<input id="e_${k}" ${k=="added"||k=="next"?'type="date"':""} value="${esc(l[k])}">`}</div>`).join("")}</div>
  ${cur=="new"?'<div style="margin-top:8px"><label style="font-size:12px;color:var(--mu)">First note</label><textarea id="e_note" rows="2"></textarea></div>':""}
  <div class="row"><button class="b" onclick="sv()">Save</button><button class="b g" onclick="nav(cur=='new'?'leads':'prof',cur)">Cancel</button></div></div>`}
async function sv(){const l=window._e,old={...l},nv={},note=(($("#e_note")||{}).value||"").trim();FLD.forEach(([k])=>nv[k]=$("#e_"+k).value.trim());const sc=ST.find(s=>s.toLowerCase()==nv.status.toLowerCase());if(!sc)return toast("Choose a valid status from the list",1);nv.status=sc;for(const f of ["country","niche","source"]){const k=FK[f],v=nv[f];if(!v||v==old[f])continue;const c=canon(k,v);if(c)nv[f]=c;else{if(!await ask(`"${v}" is not in your ${TT[k]} list. Add it so you can reuse it?`,"Add & save"))return;if(!await addOpt(k,v))return}}Object.assign(l,nv);if(note)l.notes=[{t:new Date().toISOString(),x:note}];try{await save(l);nav("prof",l.id)}catch(e){toast("Save failed: "+(e.message||e),1)}}
// CSV
function parse(t){const r=[];let row=[],c="",q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'&&t[i+1]=='"'){c+='"';i++}else if(h=='"')q=0;else c+=h}else if(h=='"')q=1;else if(h==","){row.push(c);c=""}else if(h=="\n"||h=="\r"){if(h=="\r"&&t[i+1]=="\n")i++;row.push(c);c="";if(row.some(x=>x.trim()))r.push(row);row=[]}else c+=h}row.push(c);if(row.some(x=>x.trim()))r.push(row);return r}
const csvq=v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v;
function toCsv(a){const k=FLD.map(f=>f[0]);return[FLD.map(f=>f[1]),...a.map(l=>k.map(x=>l[x]??""))].map(r=>r.map(csvq).join(",")).join("\n")}
function dl(name,data){try{const j=/\.json$/.test(name),b=new Blob([j?data:"\ufeff"+data],{type:j?"application/json":"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast("Saved "+name+" — check your Downloads folder")}catch(e){toast("Export failed: "+(e.message||e),1)}}
function impV(){
  const map=imp?`<h2>Map columns (${imp.rows.length} rows)</h2><div class="card"><div class="f">${FLD.filter(f=>f[0]!="added").map(([k,n])=>`<div><label>${n}</label><select id="mp_${k}"><option value="">— skip —</option>${imp.h.map((h,i)=>`<option value="${i}" ${imp.g[k]==i?"selected":""}>${esc(h)}</option>`).join("")}</select></div>`).join("")}</div><div class="row"><button class="b" onclick="runImp()">Validate &amp; import</button><button class="b g" onclick="imp=null;render()">Cancel</button></div></div>`:"";
  return `<h2>Import leads (CSV)</h2><div class="card"><p style="margin:0 0 8px;color:var(--mu)">Export from FrontEdge Leads as CSV (from Excel: Save As → CSV). Duplicates are matched on email, phone or website and skipped.</p><input type="file" accept=".csv,text/csv" onchange="pick(this.files[0])"><div id="rep"></div></div>${map}
  <h2>Export &amp; backup</h2><div class="card"><div class="row"><button class="b" onclick="dl('crm-waseem-leads.csv',toCsv(L))">All leads (CSV)</button><button class="b" onclick="dl('crm-waseem-filtered.csv',toCsv(filt()))">Filtered (CSV)</button><button class="b g" onclick="doBackup()">Full backup (JSON)</button></div><small style="color:var(--mu)">Last backup: ${lastBk?new Date(lastBk).toLocaleString():"never"}. Your data lives only in this browser on this device, so back up regularly.</small></div><h2>Restore from backup</h2><div class="card"><input type="file" id="rf" accept=".json,application/json"><div class="row"><button class="b" onclick="restore('merge')">Restore (merge, keep existing)</button><button class="b r" onclick="restore('replace')">Restore (replace all)</button></div></div>`}
async function pick(f){if(!f)return;const r=parse((await f.text()).replace(/^\uFEFF/,""));if(r.length<2)return toast("File has no data rows.",1);const h=r[0].map(x=>x.trim()),g={},al={name:["name","full name","contact"],biz:["business","company","business name"],title:["title","job"],email:["email","e-mail"],phone:["phone","mobile","tel"],web:["website","url","web"],country:["country"],city:["city"],niche:["niche","industry","category"],source:["source"],services:["services"],status:["status"],priority:["priority"],next:["follow"]};
  for(const k in al){const i=h.findIndex(x=>al[k].some(a=>x.toLowerCase().includes(a)));if(i>=0)g[k]=i}imp={h,rows:r.slice(1),g};render()}
async function runImp(){const g={};FLD.forEach(([k])=>{const e=$("#mp_"+k);if(e&&e.value!=="")g[k]=+e.value});const nz=s=>String(s||"").toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/[^a-z0-9@.]/g,"");
  const seen=new Set();L.forEach(l=>[l.email,l.phone,l.web].forEach(v=>nz(v)&&seen.add(nz(v))));let ok=0,dup=0,bad=[];const out=[];
  imp.rows.forEach((r,i)=>{const l=blank();for(const k in g)l[k]=(r[g[k]]||"").trim();
    if(!ST.includes(l.status))l.status="Beginning";if(l.email&&!/^\S+@\S+\.\S+$/.test(l.email)){bad.push(`Row ${i+2}: invalid email "${l.email}"`);return}
    if(!l.name&&!l.biz&&!l.email){bad.push(`Row ${i+2}: no name, business or email`);return}
    const ks=[l.email,l.phone,l.web].map(nz).filter(Boolean);if(ks.some(k=>seen.has(k))){dup++;return}ks.forEach(k=>seen.add(k));l.id=nid()+i;out.push(l)});
  for(let i=0;i<out.length;i+=20){await Promise.all(out.slice(i,i+20).map(save));ok+=Math.min(20,out.length-i)}
  imp=null;view="imp";render();$("#rep").innerHTML=`<div class="note"><b>Imported ${ok}</b>, skipped ${dup} duplicates, ${bad.length} errors.${bad.length?"<br><small>"+bad.slice(0,15).map(esc).join("<br>")+"</small>":""}</div>`}
const unsplash=()=>{const e=$("#splash");if(e){e.classList.add("go");setTimeout(()=>e.remove(),420)}};init().then(unsplash,unsplash);setTimeout(unsplash,4000);
let dip=null;const ib=()=>document.getElementById("inst"),inApp=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;

window.addEventListener("appinstalled",()=>{dip=null;ib().hidden=true;toast("CRM WASEEM installed")});
ib().onclick=async()=>{if(!dip)return;dip.prompt();try{await dip.userChoice}catch(e){}dip=null;ib().hidden=true};
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(e=>console.warn("Service worker:",e)));
